listen_addresses = '*'

# JITを無効化した候補。採用は同条件ベンチ比較後に判断する。
jit = off

# Bounded PostgreSQL diagnostics for benchmark runs; all settings reload.
log_min_duration_statement = 100ms
log_lock_waits = on
log_connections = on
log_disconnections = on
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_line_prefix = '%m [%p] %c %q%u@%d,%a '
